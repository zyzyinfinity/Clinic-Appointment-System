<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Appointment System - Our Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <nav>
        <a href="index.html" class="brand"><i class="fas fa-heartbeat"></i> ClinicCare</a>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="location.html" class="active">Location</a>
        </div>
        <div id="auth-nav"></div>
    </nav>

    <div class="container">
        <h1 style="color: var(--primary-color); margin-bottom: 2rem; text-align: center;"><i class="fas fa-map-marker-alt"></i> Find Us</h1>
        
        <div class="card">
            <div style="display: flex; flex-wrap: wrap; gap: 2rem;">
                <div style="flex: 1; min-width: 300px;">
                    <h2 style="color: var(--primary-color); margin-bottom: 1rem;">Primary Care Clinic</h2>
                    <p style="margin-bottom: 1rem;"><i class="fas fa-building" style="color: var(--primary-color); width: 25px;"></i> 123 Healthcare Avenue, Medical District, NY 10001</p>
                    <p style="margin-bottom: 1rem;"><i class="fas fa-phone" style="color: var(--primary-color); width: 25px;"></i> +1 (555) 123-4567</p>
                    <p style="margin-bottom: 1rem;"><i class="fas fa-envelope" style="color: var(--primary-color); width: 25px;"></i> contact@cliniccare.com</p>
                    
                    <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Operating Hours:</h3>
                    <ul style="list-style-type: none; padding: 0;">
                        <li style="margin-bottom: 0.5rem;"><strong>Mon - Fri:</strong> 8:00 AM - 6:00 PM</li>
                        <li style="margin-bottom: 0.5rem;"><strong>Saturday:</strong> 9:00 AM - 2:00 PM</li>
                        <li style="margin-bottom: 0.5rem;"><strong>Sunday:</strong> Closed</li>
                    </ul>
                </div>

                <div style="flex: 2; min-width: 300px;">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // New York coordinates
            const clinicLat = 40.7128;
            const clinicLng = -74.0060;

            const map = L.map('map').setView([clinicLat, clinicLng], 15);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            const customIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/2966/2966465.png', // Medical marker icon
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            });

            L.marker([clinicLat, clinicLng], {icon: customIcon}).addTo(map)
                .bindPopup('<b style="color: #2D5A27">ClinicCare Main Branch</b><br>123 Healthcare Avenue.')
                .openPopup();
        });
    </script>
</body>
</html>
